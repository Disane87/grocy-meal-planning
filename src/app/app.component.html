@if (isAppConfigured$ | async) {
@if ((recipes$ | async); as recipes) {
@if (isDesktop()) {
<div class="flex flex-row w-screen h-screen cursor-default overflow-hidden">
  <div class="flex flex-col p-4 recipes w-[272px] flex-none border-r min-h-0 overflow-hidden">
    <app-recipe-sidebar [recipes]="recipes" [recipeSearch]="recipeSearch" (recipeSearchChange)="recipeSearch = $event"
      (refreshRecipes)="onRefreshRecipes()" (importRecipe)="onImportRecipe()" (recipeSelect)="onPlanRecipeFromList($event)">
    </app-recipe-sidebar>
  </div>
  @if ((mealPlan$ | async); as mealPlan) {
  <div class="flex flex-col flex-1 h-full scheduler overflow-hidden min-w-0">
    <app-scheduler [currentWeekStart]="currentWeekStart" [currentWeek]="currentWeek"
      [mealPlanSections]="null" [mealPlan]="mealPlan" [recipes]="recipes"
      [grocyInfo]="(grocyInfo$ | async)" (weekChange)="changeWeek($event)" (openSettings)="openSettings()"
      (drop)="onDrop($event.event, $event.day, $event.sectionId)" (addRecipe)="onAddRecipe($event)">
    </app-scheduler>
  </div>
  }
</div>
} @else {
<app-mobile-shell [tab]="mobileTab" [weekStart]="currentWeekStart" [selectedDay]="selectedDay"
  [mealPlan]="(mealPlan$ | async)" [recipes]="recipes" [sections]="null"
  [recipeSearch]="recipeSearch" (tabChange)="mobileTab = $event" (daySelect)="selectDay($event)"
  (dayShift)="shiftSelectedDay($event)" (weekChange)="changeWeek($event)" (addRecipe)="onAddRecipe($event)"
  (planRecipe)="onPlanRecipeFromList($event)" (recipeSearchChange)="recipeSearch = $event"
  (refreshRecipes)="onRefreshRecipes()" (importRecipe)="onImportRecipe()" (resetConfig)="resetConfig()"
  [grocyInfo]="(grocyInfo$ | async)" (showReleaseNotes)="showReleaseNotes()">
</app-mobile-shell>
}
}
} @else {
<app-grocy-config></app-grocy-config>
}
