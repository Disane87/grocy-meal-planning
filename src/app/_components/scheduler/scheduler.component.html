<div class="flex flex-row flex-wrap items-center gap-x-4 gap-y-2 px-3 pb-3 pt-4 md:px-6 md:pt-5 md:pb-4">
    <div>
        <h1 class="text-[24px] font-semibold leading-tight tabular-nums">{{ 'WEEK' | transloco }} {{ currentWeek }}</h1>
        @if (currentWeekStart) {
        <div class="text-[14px] text-muted">{{ weekStartDate | date:'d. MMM' }} – {{ weekEndDate | date:'d. MMM yyyy' }}</div>
        }
    </div>
    <app-scheduler-controls class="flex-1 min-w-[260px]" (weekChange)="weekChange.emit($event)"
        (openSettings)="openSettings.emit()" (importRecipe)="importRecipe.emit()">
    </app-scheduler-controls>
</div>
<div class="flex flex-col flex-1 min-h-0 overflow-hidden md:px-6">
    <app-week-view [currentWeekStart]="currentWeekStart" [mealPlan]="mealPlan" [recipes]="recipes"
        [sections]="mealPlanSections" (drop)="drop.emit($event)" (addRecipe)="addRecipe.emit($event)">
    </app-week-view>
    <div class="flex flex-row justify-between px-3 py-3 text-[12px] text-muted md:px-0 md:pb-5">
        <span class="tabular-nums">{{ 'DAYS_PLANNED' | transloco:{ count: plannedDays } }}</span>
        @if (grocyInfo?.grocy_version?.Version; as version) {
        <span>Grocy {{ version }}</span>
        }
    </div>
</div>
