<div class="flex flex-col h-[70vh]">
  <div class="mx-auto mt-2 h-1 w-9 shrink-0 rounded-full bg-(--line-strong)" aria-hidden="true"></div>
  <div class="flex flex-row items-center justify-between p-4 border-b border-(--line)">
    <h2 class="text-[20px] font-semibold">{{ 'RECIPES' | transloco }}</h2>
    <button type="button" (click)="close()" [attr.aria-label]="'CLOSE' | transloco" class="btn btn-icon">
      <i class="ph-duotone ph-x" aria-hidden="true"></i>
    </button>
  </div>
  @if (showSections) {
  <div class="px-4 pt-3 flex flex-row gap-2 overflow-x-auto" role="group" [attr.aria-label]="'SECTION' | transloco">
    @for (group of groups; track group.sectionId) {
    <button type="button" class="chip" [class.active]="group.sectionId === sectionId" [attr.aria-pressed]="group.sectionId === sectionId"
      (click)="sectionId = group.sectionId">{{ group.name ?? ('NO_SECTION' | transloco) }}</button>
    }
  </div>
  }
  <div class="p-4 border-b border-(--line) flex flex-row gap-2">
    <input type="text" [(ngModel)]="searchTerm"
      [placeholder]="'RECIPE_SEARCH_PLACEHOLDER' | transloco"
      [title]="'RECIPE_SEARCH_PLACEHOLDER' | transloco"
      class="field flex-1 min-w-0" />
    <button type="button" (click)="onRefreshRecipes()" [attr.aria-label]="'REFRESH_RECIPES' | transloco" [title]="'REFRESH_RECIPES' | transloco"
      class="btn btn-icon">
      <i class="ph-duotone ph-arrow-clockwise" aria-hidden="true"></i>
    </button>
  </div>
  <div class="flex-1 overflow-auto p-2 pb-[max(0.5rem,env(safe-area-inset-bottom))] flex flex-col gap-2">
    @for (recipe of filteredRecipes; track recipe.id) {
    <button type="button" (click)="selectRecipe(recipe)"
      class="flex flex-row items-center gap-3 p-3 rounded-xl hover:bg-(--surface-muted) active:bg-(--accent-surface) text-left w-full min-h-[56px] border border-(--line) transition-colors">
      @if (recipe.picture_file_name) {
      <img class="w-12 h-12 rounded object-cover flex-shrink-0"
        [src]="(('recipepictures' | grocyImage:recipe.picture_file_name) | async)"
        [alt]="recipe.name">
      }
      <span class="flex-1 text-base">{{ recipe.name }}</span>
    </button>
    }
    @if (filteredRecipes.length === 0) {
    <div class="text-center text-muted py-8">{{ 'NO_RECIPES_FOUND' | transloco }}</div>
    }
  </div>
</div>
