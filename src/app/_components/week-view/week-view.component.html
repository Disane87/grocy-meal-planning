<div class="grid grid-cols-7 grid-rows-[repeat(3,minmax(0,1fr))] gap-2 flex-1 min-h-0 overflow-hidden">
    @for (day of days; track day.date.getTime()) {
    <app-day-column [class.opacity-60]="day.past" [day]="day.date" [groups]="day.groups" [showHeadings]="day.showHeadings" [recipes]="recipes"
        (drop)="drop.emit($event)" (addRecipe)="addRecipe.emit($event)">
    </app-day-column>
    }
</div>
