<button type="button" (click)="onWeekChange(-1)" [title]="'PREVIOUS_WEEK' | transloco" [attr.aria-label]="'PREVIOUS_WEEK' | transloco"
    class="btn btn-icon bar-btn">
    <i class="ph-duotone ph-caret-left" aria-hidden="true"></i>
</button>
<button type="button" (click)="onWeekChange(0)" class="btn bar-btn">{{ 'TODAY' | transloco }}</button>
<button type="button" (click)="onWeekChange(1)" [title]="'NEXT_WEEK' | transloco" [attr.aria-label]="'NEXT_WEEK' | transloco"
    class="btn btn-icon bar-btn">
    <i class="ph-duotone ph-caret-right" aria-hidden="true"></i>
</button>
<button type="button" (click)="onImportRecipe()" [title]="'RECIPE_IMPORT.TITLE' | transloco" [attr.aria-label]="'RECIPE_IMPORT.TITLE' | transloco"
    class="btn btn-icon bar-btn md:hidden">
    <i class="ph-duotone ph-link-simple" aria-hidden="true"></i>
</button>
<button type="button" (click)="onOpenSettings()" [attr.aria-label]="'SETTINGS' | transloco" [title]="'SETTINGS' | transloco"
    class="btn btn-icon bar-btn ml-auto">
    <i class="ph-duotone ph-gear-six" aria-hidden="true"></i>
</button>
