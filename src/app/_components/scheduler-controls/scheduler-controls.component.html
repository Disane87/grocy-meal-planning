<div class="socials text-stone-400 text-2xl hidden md:flex flex-row gap-2 items-center mr-3">
    <a href="https://github.com/Disane87/grocy-meal-planning" target="_blank" rel="noopener"
        aria-label="GitHub" class="items-center flex flex-col"><i class="ph-duotone ph-github-logo hover:text-stone-600" aria-hidden="true"></i></a>
    <a href="https://blog.disane.dev/en" target="_blank" rel="noopener" aria-label="Blog" class="items-center flex flex-col">
        <i class="ph-duotone ph-article hover:text-stone-600" aria-hidden="true"></i></a>
</div>
<div class="hidden md:block">
    <app-theme-toggle></app-theme-toggle>
</div>
<select [ngModel]="selectedMealPlanSection" (ngModelChange)="onSectionChange($event)"
    class="control-select text-sm md:text-base hidden md:block">
    <option [value]="null" disabled selected>{{ 'GROCY_MEALPLAN_SECTION_PLACEHOLDER' | transloco }}</option>
    @for (section of mealPlanSections; track section) {
    <option [ngValue]="section.id">{{section.name ?? ('GROCY_MEALPLAN_SECTION_NONE' | transloco) }}</option>
    }
</select>
<div class="flex flex-row gap-1 justify-center md:justify-end scheduler-controls">
    <button (click)="onWeekChange(-1)" [title]="'PREVIOUS_WEEK' | transloco" [attr.aria-label]="'PREVIOUS_WEEK' | transloco"
        class="control-btn">
        <i class="ph-duotone ph-caret-left" aria-hidden="true"></i>
    </button>
    <button (click)="onWeekChange(0)" [title]="'THIS_WEEK' | transloco" [attr.aria-label]="'THIS_WEEK' | transloco"
        class="control-btn-primary">
        <i class="ph-duotone ph-calendar-dot" aria-hidden="true"></i>
    </button>
    <button type="button" (click)="onWeekChange(1)" [title]="'NEXT_WEEK' | transloco" [attr.aria-label]="'NEXT_WEEK' | transloco"
        class="control-btn">
        <i class="ph-duotone ph-caret-right" aria-hidden="true"></i>
    </button>
    <button type="button" (click)="onImportRecipe()" [title]="'RECIPE_IMPORT.TITLE' | transloco" [attr.aria-label]="'RECIPE_IMPORT.TITLE' | transloco"
        class="control-btn-primary md:hidden">
        <i class="ph-duotone ph-link-simple" aria-hidden="true"></i>
    </button>
    <div class="relative">
        <button type="button" (click)="onShare()" [attr.aria-label]="'SHARE' | transloco" [title]="'SHARE' | transloco"
            class="control-btn">
            <i class="ph-duotone ph-share-network" aria-hidden="true"></i>
        </button>
        @if (shareTooltip) {
        <div class="absolute -bottom-8 left-1/2 -translate-x-1/2 whitespace-nowrap text-xs glass-panel text-[--text-primary] px-2 py-1 rounded">
            {{ shareTooltip }}
        </div>
        }
    </div>
    <button type="button" (click)="onResetConfig()" [title]="'RESET_CONFIG' | transloco" [attr.aria-label]="'RESET_CONFIG' | transloco"
        class="control-btn-danger hidden md:flex">
        <i class="ph-duotone ph-sign-out" aria-hidden="true"></i>
    </button>
</div>
