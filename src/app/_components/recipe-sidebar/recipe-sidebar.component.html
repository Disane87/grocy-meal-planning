<div class="flex h-full flex-col gap-3">
    <div class="flex items-baseline justify-between px-2">
        <h1 class="text-[20px] font-semibold">{{ 'RECIPES' | transloco }}</h1>
        <span class="text-[13px] tabular-nums text-muted">{{ recipes?.length ?? 0 }}</span>
    </div>
    <div class="flex flex-row gap-1">
        <div class="relative min-w-0 flex-1">
            <i class="ph-duotone ph-magnifying-glass pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-muted" aria-hidden="true"></i>
            <input [ngModel]="recipeSearch" (ngModelChange)="onRecipeSearchChange($event)" type="text"
                [placeholder]="'RECIPE_SEARCH_PLACEHOLDER' | transloco" [attr.aria-label]="'RECIPE_SEARCH_PLACEHOLDER' | transloco"
                class="field w-full !h-10 !text-[14px] !pl-9" />
        </div>
        <button type="button" (click)="onRefreshRecipes()" [attr.aria-label]="'REFRESH_RECIPES' | transloco" [title]="'REFRESH_RECIPES' | transloco"
            class="btn btn-icon flex-none">
            <i class="ph-duotone ph-arrow-clockwise" aria-hidden="true"></i>
        </button>
    </div>
    <div class="recipe-container flex min-h-0 flex-1 flex-col overflow-auto">
        <app-grocy-recipe-list
            [recipes]="(recipes | filterArray:recipeSearch:['name'] | orderBy:'name')"></app-grocy-recipe-list>
    </div>
    <button type="button" (click)="onImportRecipe()" class="btn w-full flex-none !bg-transparent shadow-[inset_0_0_0_1px_var(--line-strong)]">
        <i class="ph-duotone ph-link-simple" aria-hidden="true"></i>{{ 'RECIPE_IMPORT.TITLE' | transloco }}
    </button>
</div>
