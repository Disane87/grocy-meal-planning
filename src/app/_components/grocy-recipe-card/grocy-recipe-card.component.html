<!-- Mobile: Swipe-to-reveal actions -->
<div class="md:hidden relative overflow-hidden rounded-lg"
  [ngClass]="meal?.userfields?.ai_planned == '1' ? 'ring-2 ring-violet-400/50 shadow-[0_0_12px_rgba(124,58,237,0.15)]' : 'ring-1 ring-white/20'">
  @if (recipe) {
  <!-- Swipe action buttons (behind the card) -->
  <div class="absolute right-0 top-0 bottom-0 flex flex-row items-stretch z-0">
    @if (meal && meal.done == 0) {
    <button type="button" (click)="onSwipeAction('done')" [attr.aria-label]="'MARK_COOKED' | transloco" [title]="'MARK_COOKED' | transloco"
      class="bg-emerald-500 text-white flex items-center justify-center w-[50px]">
      <i class="ph-duotone ph-check" aria-hidden="true"></i>
    </button>
    }
    @if (meal && meal.done == 0) {
    <button type="button" (click)="onSwipeAction('delete')" [attr.aria-label]="'REMOVE' | transloco" [title]="'REMOVE' | transloco"
      class="bg-rose-500 text-white flex items-center justify-center w-[50px]">
      <i class="ph-duotone ph-trash" aria-hidden="true"></i>
    </button>
    }
    <button type="button" (click)="onSwipeAction('open')" [attr.aria-label]="'OPEN_RECIPE' | transloco" [title]="'OPEN_RECIPE' | transloco"
      class="bg-sky-500 text-white flex items-center justify-center w-[50px]">
      <i class="ph-duotone ph-book-open" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Swipeable card content -->
  <div class="relative z-10 card-surface rounded-lg overflow-hidden"
    [class.opacity-40]="meal?.done"
    [style.transform]="'translateX(' + swipeOffset + 'px)'"
    [style.transition]="swipeOffset === 0 || swipeOffset === -150 ? 'transform 0.2s ease-out' : 'none'"
    (touchstart)="onTouchStart($event)"
    (touchmove)="onTouchMove($event)"
    (touchend)="onTouchEnd()">
    <div class="relative">
      @if (recipe.picture_file_name) {
      <img class="w-full h-20 object-cover" loading="lazy"
        [src]="(('recipepictures' | grocyImage:recipe.picture_file_name) | async)" [alt]="recipe.name">
      } @else {
      <div class="w-full h-20 bg-gradient-to-br from-violet-300/40 to-indigo-400/40 dark:from-violet-800/40 dark:to-indigo-900/40"></div>
      }
      <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent px-2.5 pb-1.5 pt-6">
        <div class="text-white text-xs font-normal leading-tight truncate drop-shadow-md">{{ recipe.name }}</div>
      </div>
    </div>
  </div>
  }
</div>

<!-- Desktop: Hover overlay actions -->
<div class="hidden md:block relative rounded-lg overflow-hidden group"
  [ngClass]="meal?.userfields?.ai_planned == '1' ? 'ring-2 ring-violet-400/50 shadow-[0_0_12px_rgba(124,58,237,0.15)]' : 'ring-1 ring-white/20'">
  @if (recipe) {
  <div class="recipe card-surface" [class.opacity-40]="meal?.done"
    [dndDraggable]="{ recipe, meal }"
    [dndEffectAllowed]="$any(draggable.effectAllowed)" [dndDisableIf]="draggable.disable">
    <div class="relative">
      @if (recipe.picture_file_name) {
      <img class="w-full aspect-[16/10] object-cover" loading="lazy"
        [src]="(('recipepictures' | grocyImage:recipe.picture_file_name) | async)" [alt]="recipe.name">
      } @else {
      <div class="w-full aspect-[16/10] bg-gradient-to-br from-violet-300/40 to-indigo-400/40 dark:from-violet-800/40 dark:to-indigo-900/40"></div>
      }

      <!-- Action buttons overlay (top-right, on hover) -->
      <div class="absolute top-0 right-0 p-1.5 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
        @if (meal && meal.done == 0) {
        <button type="button" (click)="doneMeal(meal)" [attr.aria-label]="'MARK_COOKED' | transloco" [title]="'MARK_COOKED' | transloco"
          class="action-pill hover:!bg-emerald-500 hover:!text-white">
          <i class="ph-duotone ph-check text-base text-emerald-600" aria-hidden="true"></i>
        </button>
        }
        @if (meal && meal.done == 0) {
        <button type="button" (click)="deleteMeal(meal)" [attr.aria-label]="'REMOVE' | transloco" [title]="'REMOVE' | transloco"
          class="action-pill hover:!bg-rose-500 hover:!text-white">
          <i class="ph-duotone ph-trash text-base text-rose-500" aria-hidden="true"></i>
        </button>
        }
        <button type="button" (click)="openRecipe(meal?.recipe_id || recipe.id)" [attr.aria-label]="'OPEN_RECIPE' | transloco" [title]="'OPEN_RECIPE' | transloco"
          class="action-pill hover:!bg-sky-500 hover:!text-white">
          <i class="ph-duotone ph-book-open text-base text-sky-600" aria-hidden="true"></i>
        </button>
        <div dndHandle class="action-pill cursor-grab">
          <i class="ph-duotone ph-dots-six-vertical text-base text-[--text-muted]" aria-hidden="true"></i>
        </div>
      </div>

      <!-- Text overlay at bottom -->
      <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent px-3 pb-2.5 pt-8">
        <div class="text-white text-sm font-normal leading-tight truncate drop-shadow-md">{{ recipe.name }}</div>
      </div>
    </div>
  </div>
  }
</div>
